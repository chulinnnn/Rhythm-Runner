name: 工单
description: Rhythm Runner 日常任务
title: "RR-"
body:
  - type: input
    id: rr_id
    attributes:
      label: 卡片号（可选）
      description: 例如 RR-049，没有就先留空
      placeholder: RR-049
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: 要做什么
      description: 两三句话说清楚，别写长 checklist
      placeholder: Vertical 教程里 Retry 之后还想跳过 briefing……
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 怎么算做完
      placeholder: Play 一遍，Retry 后不再播那段说明；Console 干净。
    validations:
      required: true
  - type: dropdown
    id: epic
    attributes:
      label: 大概属于哪块
      options:
        - E-01 Start / 共用
        - E-02 WorldMusicExplorer
        - E-03 Ocean
        - E-04 Vertical
        - E-05 Advanced
        - E-06 测试 / 提交 / 文档
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: 急不急
      options:
        - P1
        - P2
        - P0
    validations:
      required: false
