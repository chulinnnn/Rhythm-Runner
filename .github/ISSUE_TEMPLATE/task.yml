name: Task
description: Rhythm Runner day-to-day work item
title: "RR-"
body:
  - type: input
    id: rr_id
    attributes:
      label: Card ID (optional)
      description: e.g. RR-049 — leave blank if not assigned yet
      placeholder: RR-049
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What to do
      description: A few plain sentences — no long checklist
      placeholder: After Retry in Vertical tutorial, skip the briefing…
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: Play once — Retry skips briefing; Console clean.
    validations:
      required: true
  - type: dropdown
    id: epic
    attributes:
      label: Area
      options:
        - E-01 Start / shared
        - E-02 WorldMusicExplorer
        - E-03 Ocean
        - E-04 Vertical
        - E-05 Advanced
        - E-06 QA / submission / docs
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1
        - P2
        - P0
    validations:
      required: false
